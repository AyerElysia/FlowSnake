# Official five-action RL stage for the MoonViT+Flow VerSe mainline.
# The offline MoonViT layer-18 encoder and learned feature replacer are frozen;
# only the inherited Flow is optimized. RL uses the released five-stage
# full-extrap trajectory, while every reported evaluation remains the deployed
# two-outer-stage AB2 trajectory (2 x 4 = 8 NFE).
model: 'moonvit_flow_ha_smoe_stage2_rl'
task: 'snake'
model_dir: 'data/outputs/stage2_rl'
gpus: [0]
resume: false
resume_weights_only: true
resume_path: 'artifacts/checkpoints/ha_smoe_stage1_best.pt'
resume_allow_partial_copy: false
resume_exclude_prefixes: []
resume_allowed_missing_prefixes: []
resume_source_format: 'strict_ha_smoe_supervised_checkpoint'
train_or_test: train

pure2d_memory_free_required: true
pure2d_internal_detector_free_required: true
pure2d_expected_parameter_count: 16933968

train:
    dataset: 'VolMemTrain'
    per_contour: false
    optim: 'adamw'
    lr: 0.00000004
    eta_min: 0.00000004
    locate_lr_multiplier: 1.0
    milestones: (80, 120)
    gamma: 0.5
    batch_size: 1
    gradient_accumulation_steps: 1
    gradient_clip: 1.0
    weight_decay: 0.01
    warmup_steps: 1000
    drop_last: true
    epoch: 220
    max_steps: 10000
    step_checkpoint_every: 250
    step_checkpoint_keep: 12
    step_checkpoint_milestones: [250, 500, 1000, 2000, 5000, 10000]
    num_workers: 0
    save_ep: 0
    max_ct_num: 32

test:
    # Hyperparameter selection uses the independent validation split after
    # removing the locked 010/011/013 cases: 37 cases, 5914 rows.  The trainer
    # dynamically registers the immutable, SHA-pinned filtered manifest.
    dataset: 'VolMemFourierVal37'
    batch_size: 1
    epoch: -1

sagittal_train_exclude_case_ids: ['sub-verse004', 'sub-verse005', 'sub-verse033', 'sub-verse043', 'sub-verse060', 'sub-verse064', 'sub-verse082', 'sub-verse410_split-verse267']
sagittal_eval_include_case_ids: []
sagittal_forbidden_case_ids: ['sub-verse010', 'sub-verse011', 'sub-verse013']
sagittal_expected_train_case_count: 72
sagittal_expected_train_row_count: 13261
sagittal_expected_eval_case_count: 0
sagittal_expected_eval_row_count: 0

detector_backend: 'flow_box_only'
use_gt_det: true
use_gt_det_train_only: true
gt_detection_class_offset: 1

locate_feat_inject: false
locate_feat_replace: true
locate_feat_cache_root: 'data/sagittal_moonvit_cache'
locate_feat_keys: ['layer_18']
locate_feat_dim: 1152
locate_feat_input_layers: 1
locate_feat_fusion_mode: 'center_only'
sagittal_moonvit_fusion_mode: 'center_only'
sagittal_moonvit_feature_key: 'layer_18'
locate_feat_replace_hidden_dim: 512
locate_feat_replace_out_channels: 256
locate_feat_replace_upscale: 2
locate_feat_resample_padding_mode: 'border'
snake_feature_dim: 256
gcn_sample_mode: 'half_pixel'
gcn_sample_padding_mode: 'border'

# MoonViT itself is not instantiated in this training graph. Its signed
# 448x448, patch-14, layer-18 cache is read by the dataset. The 3.246M feature
# replacer is inherited from stage 1 and frozen during RL.

sagittal_component_mode: 'significant'
sagittal_max_components_per_class: 4
sagittal_min_component_area_raw: 2.0
sagittal_max_instances_per_slice: 32
min_poly_area_output: 0.5

use_diffusion_evolution: true
use_flow_matching: true
flow_2d_s_conditioning: true
flow_ode_steps: 4
flow_train_noise_scale: 1.0
diffusion_loss_weight: 1.0
diffusion_disp_norm: true
diffusion_disp_stats: 'data/stats/volmem_sagittal_disp_stats.json'
dit_num_layers: 6
dit_num_heads: 8
dit_state_dim: 256
iterative_fractions: [0.6667, 1.0]
iterative_ode_steps: 4
flow_ode_solver: 'ab2'
infer_noise_scale: 1.0
infer_avg_samples: 1
use_grpo: true
anatomical_class_count: 26
use_diffusion_trainer: true

contour_init_method: 'octagon'
diffusion_init_source: 'bbox_octagon'

routeb_box_jitter_enabled: true
routeb_box_jitter_probabilities: [0.35, 0.40, 0.20, 0.05]
routeb_box_jitter_shift_fractions: [0.0, 0.05, 0.10, 0.15]
routeb_box_jitter_log_scale_fractions: [0.0, 0.10, 0.20, 0.30]
routeb_box_jitter_edge_fractions: [0.0, 0.03, 0.08, 0.15]
routeb_box_jitter_min_iou: 0.20

train_progress_sigma: 0.05
train_progress_uniform_prob: 0.15
train_progress_centers: [0.0, 0.3333, 0.5, 0.80, 0.97]
train_progress_weights: [0.2933, 0.1767, 0.27, 0.179, 0.081]

use_amp: true
amp_dtype: 'float16'
enable_tf32: true
cudnn_benchmark: true
cuda_empty_cache_interval: 0

# Released five-stage full-extrap RL trajectory. Fractions are residual
# fractions, hence cumulative progress is exactly 20/40/60/80/100 percent.
# Each outer stage owns one low-frequency Fourier normal-field action; the four
# AB2 evaluations inside a stage remain deterministic solver work.
rl_train_steps: 10000
rl_k: 8
rl_outer_steps: 5
rl_fractions: [0.2, 0.25, 0.3333, 0.5, 1.0]
rl_ode_steps: 4
rl_initial_noise_scale: 1.0
rl_max_contours: 4

# Immutable production evaluation contract. These values are deliberately
# separate from the five-stage training trajectory above.
rl_deployment_outer_steps: 2
rl_deployment_fractions: [0.6667, 1.0]
rl_deployment_ode_steps: 4

rl_action_policy: 'geom'
rl_geom_lowfreq_modes: 8
rl_geom_sigma_px: [0.8, 0.7, 0.6, 0.5, 0.4]

rl_flow_only_update: true

rl_ppo_inner_epochs: 2
rl_ppo_clip: 0.05
rl_ppo_kl_target: 0.002
# This is an outer-action policy, so the frozen reference Flow can be compared
# under the exact same stage state and initial latent.
rl_kl_beta: 0.01
rl_adv_clip_max: 2.0
rl_adv_std_floor: 0.1
rl_adv_center_group: true
rl_grad_clip_norm: 0.25
rl_lr: 4.0e-8

rl_per_step_reward_weight: 1.0
rl_per_step_credit_mode: 'full_extrap'

# Released contour-RL reward. Both the terminal trajectory and every
# full-extrap stage use sampled NSD minus the same-latent deterministic NSD.
# This is 2D NSD@2px, not the 3D physical-space NSD@2mm evaluation metric.
rl_use_delta_nsd_reward: true
rl_nsd_delta_px: 2.0
rl_reward_burr_weight: 0.06
rl_reward_burr_max_px: 1.5
rl_reward_burr_margin_px: 0.50
rl_reward_burr_quantile: 95.0

rl_eval_batches: 80
rl_eval_panel_size: 80
# Fail closed before the first RL update if the inherited supervised model is
# not producing a plausible MoonViT+Flow baseline on the immutable panel.
rl_min_baseline_iou: 0.45
rl_min_baseline_dice: 0.60
rl_eval_every: 50
rl_save_every: 50
rl_log_every: 1
rl_viz_every: 0
rl_seed: 20260824
rl_min_load_ratio: 100.0
